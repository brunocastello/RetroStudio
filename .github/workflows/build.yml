name: Build RetroStudio for Mac OS 9

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/autc04/retro68:latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure CMake with Retro68 Toolchain
        run: |
          # Use the PowerPC Carbon toolchain (not the m68k one)
          TOOLCHAIN=$(find /Retro68-build -name "retrocarbon.toolchain.cmake" 2>/dev/null | head -1)
          if [ -z "$TOOLCHAIN" ]; then
            echo "ERROR: Could not locate retrocarbon.toolchain.cmake"
            find /Retro68-build -name "*.cmake" 2>/dev/null || true
            exit 1
          fi
          echo "Using toolchain: $TOOLCHAIN"
          mkdir build && cd build
          cmake .. \
            -DCMAKE_TOOLCHAIN_FILE="$TOOLCHAIN" \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build Executable and Disk Image
        run: |
          cd build
          make -j$(nproc) RetroStudio

      - name: Package Disk Image Artifact (.img)
        run: |
          mkdir -p output
          # Copy generated disk image file from Retro68 build output
          find build -name "*.img" -exec cp {} output/ \; || true
          find build -name "*.bin" -exec cp {} output/ \; || true
          find build -name "*.dsk" -exec cp {} output/ \; || true

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: RetroStudio-OS9-DiskImage
          path: output/*
