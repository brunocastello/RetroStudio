name: Build RetroStudio for Mac OS 9

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/autc04/retro68:latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Inspect PPC toolchain
        run: |
          echo "=== PPC toolchain bin/ ==="
          ls /Retro68-build/toolchain/powerpc-apple-macos/bin/ 2>/dev/null || echo "(not found)"
          echo "=== Retro68 top-level bin/ ==="
          ls /Retro68-build/bin/ 2>/dev/null || echo "(not found)"
          echo "=== add_application.cmake (PPC) ==="
          cat /Retro68-build/toolchain/powerpc-apple-macos/cmake/add_application.cmake 2>/dev/null || echo "(not found)"
          echo "=== retrocarbon.toolchain.cmake ==="
          cat /Retro68-build/toolchain/powerpc-apple-macos/cmake/retrocarbon.toolchain.cmake 2>/dev/null || echo "(not found)"

      - name: Diagnose GWorld/CGrafPtr headers (investigation only, no build changes)
        shell: bash
        run: |
          set +e
          H=/Retro68-build/toolchain/powerpc-apple-macos/include/Quickdraw.h
          echo "=== Using header: $H ==="
          ls -la "$H"
          echo ""
          echo "=== CGrafPtr / GWorldPtr / CGrafPort typedefs ==="
          grep -n -E "typedef.*(CGrafPtr|GWorldPtr|CGrafPort)\b|struct CGrafPort" "$H"
          echo "(exit $?, 1 = no matches, not an error)"
          echo ""
          echo "=== NewGWorld / SetGWorld / GetGWorldPixMap / GetPort signatures ==="
          grep -n -A2 -E "NewGWorld|SetGWorld|GetGWorldPixMap|CGrafPtr GetPort|GetGWorld\(" "$H"
          echo "(exit $?, 1 = no matches, not an error)"
          echo ""
          echo "=== Legacy BitMap / SetPortBits availability ==="
          grep -n "SetPortBits" "$H"
          echo "(exit $?, 1 = no matches, not an error)"
          echo ""
          echo "=== CTabHandle / color table structures ==="
          grep -n -B1 -A1 "CTabHandle" "$H" | head -40
          echo "(exit $?, 1 = no matches, not an error)"
          echo ""
          echo "=== Multiversal source header for comparison (if present) ==="
          M=/Retro68-build/toolchain/multiversal/CIncludes/Quickdraw.h
          if [ -f "$M" ]; then
            echo "--- $M ---"
            grep -n -E "typedef.*(CGrafPtr|GWorldPtr|CGrafPort)\b|struct CGrafPort" "$M"
          else
            echo "(not found at $M)"
          fi
          echo ""
          echo "=== Which lib provides these symbols ==="
          find / -iname "libCarbonLib*" -o -iname "libQuickDraw*" 2>/dev/null
          echo "=== done ==="
          exit 0

      - name: Configure CMake with Retro68 Toolchain
        run: |
          TOOLCHAIN=$(find /Retro68-build -name "retrocarbon.toolchain.cmake" 2>/dev/null | head -1)
          if [ -z "$TOOLCHAIN" ]; then
            echo "ERROR: Could not locate retrocarbon.toolchain.cmake"
            exit 1
          fi
          echo "Using toolchain: $TOOLCHAIN"
          mkdir build && cd build
          cmake .. \
            -DCMAKE_TOOLCHAIN_FILE="$TOOLCHAIN" \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build Executable and Package
        run: |
          cd build
          make -j$(nproc)

      - name: List build tree
        run: find build -not -path "*/CMakeFiles/*" | sort

      - name: Collect artifact
        run: |
          mkdir -p output
          # RetroStudio_APPL (ALL target) produces .bin, .APPL, .dsk via MakePEF+Rez
          find build \( -name "*.bin" -o -name "*.dsk" -o -name "*.APPL" \) \
               -not -path "*/CMakeFiles/*" \
               -exec cp {} output/ \;
          echo "=== output/ ==="
          ls -lh output/

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RetroStudio-OS9
          path: output/*
