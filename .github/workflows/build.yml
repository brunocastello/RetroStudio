name: Build RetroStudio for Mac OS 9

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/autc04/retro68:latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Inspect PPC toolchain
        run: |
          echo "=== PPC toolchain bin/ ==="
          ls /Retro68-build/toolchain/powerpc-apple-macos/bin/ 2>/dev/null || echo "(not found)"
          echo "=== Retro68 top-level bin/ ==="
          ls /Retro68-build/bin/ 2>/dev/null || echo "(not found)"
          echo "=== add_application.cmake (PPC) ==="
          cat /Retro68-build/toolchain/powerpc-apple-macos/cmake/add_application.cmake 2>/dev/null || echo "(not found)"
          echo "=== retrocarbon.toolchain.cmake ==="
          cat /Retro68-build/toolchain/powerpc-apple-macos/cmake/retrocarbon.toolchain.cmake 2>/dev/null || echo "(not found)"

      - name: Diagnose raw-framebuffer pixel-write APIs (investigation only, no build changes)
        shell: bash
        run: |
          set +e
          M=/Retro68-build/toolchain/multiversal/CIncludes
          echo "=== Searching $M for pixel-buffer access APIs ==="
          echo ""
          echo "=== GetPortPixMap ==="
          grep -rn "GetPortPixMap" "$M" 2>/dev/null
          echo "(exit $?, 1 = no matches)"
          echo ""
          echo "=== GetPixBaseAddr ==="
          grep -rn "GetPixBaseAddr" "$M" 2>/dev/null
          echo "(exit $?, 1 = no matches)"
          echo ""
          echo "=== PixMap struct / rowBytes / pixelSize fields ==="
          grep -rn -A15 "^struct PixMap\b\|^} PixMap;" "$M" 2>/dev/null | head -40
          echo "(exit $?, 1 = no matches)"
          echo ""
          echo "=== GetGWorldPixMap (fallback reference point, known to exist) ==="
          grep -rn "GetGWorldPixMap" "$M" 2>/dev/null
          echo "(exit $?, 1 = no matches)"
          echo ""
          echo "=== portPixMap field (direct CGrafPort struct access) ==="
          grep -rn -B3 -A3 "portPixMap" "$M" 2>/dev/null | head -60
          echo "(exit $?, 1 = no matches)"
          echo ""
          echo "=== CGrafPort struct definition ==="
          grep -rln "CGrafPort" "$M" 2>/dev/null
          F=$(grep -rl "typedef struct CGrafPort\|^struct CGrafPort" "$M" 2>/dev/null | head -1)
          if [ -n "$F" ]; then
            echo "--- found in $F ---"
            grep -n -A40 "struct CGrafPort" "$F" | head -50
          fi
          echo ""
          echo "=== PixMap struct definition (any style) ==="
          F2=$(grep -rl "PixMap {" "$M" 2>/dev/null | head -1)
          if [ -n "$F2" ]; then
            echo "--- found in $F2 ---"
            grep -n -B2 -A20 "PixMap {" "$F2" | head -30
          else
            echo "(no 'PixMap {' match, trying looser search)"
            grep -rn "rowBytes" "$M" 2>/dev/null | head -10
          fi
          echo "=== done ==="
          exit 0

      - name: Configure CMake with Retro68 Toolchain
        run: |
          TOOLCHAIN=$(find /Retro68-build -name "retrocarbon.toolchain.cmake" 2>/dev/null | head -1)
          if [ -z "$TOOLCHAIN" ]; then
            echo "ERROR: Could not locate retrocarbon.toolchain.cmake"
            exit 1
          fi
          echo "Using toolchain: $TOOLCHAIN"
          mkdir build && cd build
          cmake .. \
            -DCMAKE_TOOLCHAIN_FILE="$TOOLCHAIN" \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build Executable and Package
        run: |
          cd build
          make -j$(nproc)

      - name: List build tree
        run: find build -not -path "*/CMakeFiles/*" | sort

      - name: Collect artifact
        run: |
          mkdir -p output
          # RetroStudio_APPL (ALL target) produces .bin, .APPL, .dsk via MakePEF+Rez
          find build \( -name "*.bin" -o -name "*.dsk" -o -name "*.APPL" \) \
               -not -path "*/CMakeFiles/*" \
               -exec cp {} output/ \;
          echo "=== output/ ==="
          ls -lh output/

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RetroStudio-OS9
          path: output/*
