name: Build RetroStudio for Mac OS 9

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/autc04/retro68:latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Inspect PPC toolchain
        run: |
          echo "=== PPC toolchain bin/ ==="
          ls /Retro68-build/toolchain/powerpc-apple-macos/bin/ 2>/dev/null || echo "(not found)"
          echo "=== Retro68 top-level bin/ ==="
          ls /Retro68-build/bin/ 2>/dev/null || echo "(not found)"
          echo "=== add_application.cmake (PPC) ==="
          cat /Retro68-build/toolchain/powerpc-apple-macos/cmake/add_application.cmake 2>/dev/null || echo "(not found)"
          echo "=== retrocarbon.toolchain.cmake ==="
          cat /Retro68-build/toolchain/powerpc-apple-macos/cmake/retrocarbon.toolchain.cmake 2>/dev/null || echo "(not found)"

      - name: Configure CMake with Retro68 Toolchain
        run: |
          TOOLCHAIN=$(find /Retro68-build -name "retrocarbon.toolchain.cmake" 2>/dev/null | head -1)
          if [ -z "$TOOLCHAIN" ]; then
            echo "ERROR: Could not locate retrocarbon.toolchain.cmake"
            exit 1
          fi
          echo "Using toolchain: $TOOLCHAIN"
          mkdir build && cd build
          cmake .. \
            -DCMAKE_TOOLCHAIN_FILE="$TOOLCHAIN" \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build Executable
        run: |
          cd build
          make -j$(nproc) RetroStudio

      - name: List build tree
        run: find build -not -path "*/CMakeFiles/*" | sort

      - name: Convert XCOFF to PEF and package
        run: |
          mkdir -p output
          XCOFF="build/RetroStudio.xcoff"

          if [ ! -f "$XCOFF" ]; then
            echo "ERROR: $XCOFF not found"
            exit 1
          fi

          # Search for PEF conversion tool (Apple MakePEF or Retro68 equivalent)
          MAKEPEF=$(find /Retro68-build -name "MakePEF" -o -name "makepef" \
                         -o -name "xcoff2pef" -o -name "ppc-macos-makepef" \
                         2>/dev/null | head -1)
          echo "MakePEF tool: ${MAKEPEF:-(not found)}"

          # Also look for any post-link wrapper scripts
          echo "=== Candidate converter tools ==="
          find /Retro68-build -name "*pef*" -o -name "*xcoff*" -o -name "*macho*" \
               2>/dev/null | grep -v CMakeFiles | sort || true

          if [ -n "$MAKEPEF" ]; then
            "$MAKEPEF" "$XCOFF" -o output/RetroStudio.pef
            echo "PEF produced: output/RetroStudio.pef"
          else
            # No converter found yet — copy XCOFF so artifact is never empty
            cp "$XCOFF" output/RetroStudio.xcoff
            echo "WARNING: No PEF converter found. Packaged raw XCOFF for inspection."
          fi

          # Also copy any .bin / .dsk / .img the build may have produced
          find build \( -name "*.bin" -o -name "*.img" -o -name "*.dsk" \) \
               -not -path "*/CMakeFiles/*" \
               -exec cp {} output/ \; 2>/dev/null || true

          echo "=== output/ contents ==="
          ls -lh output/

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RetroStudio-OS9
          path: output/*
