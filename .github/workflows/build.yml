name: Build RetroStudio for Mac OS 9

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/autc04/retro68:latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Inspect PPC toolchain
        run: |
          echo "=== PPC toolchain bin/ ==="
          ls /Retro68-build/toolchain/powerpc-apple-macos/bin/ 2>/dev/null || echo "(not found)"
          echo "=== Retro68 top-level bin/ ==="
          ls /Retro68-build/bin/ 2>/dev/null || echo "(not found)"
          echo "=== add_application.cmake (PPC) ==="
          cat /Retro68-build/toolchain/powerpc-apple-macos/cmake/add_application.cmake 2>/dev/null || echo "(not found)"
          echo "=== retrocarbon.toolchain.cmake ==="
          cat /Retro68-build/toolchain/powerpc-apple-macos/cmake/retrocarbon.toolchain.cmake 2>/dev/null || echo "(not found)"

      - name: Configure CMake with Retro68 Toolchain
        run: |
          TOOLCHAIN=$(find /Retro68-build -name "retrocarbon.toolchain.cmake" 2>/dev/null | head -1)
          if [ -z "$TOOLCHAIN" ]; then
            echo "ERROR: Could not locate retrocarbon.toolchain.cmake"
            exit 1
          fi
          echo "Using toolchain: $TOOLCHAIN"
          mkdir build && cd build
          cmake .. \
            -DCMAKE_TOOLCHAIN_FILE="$TOOLCHAIN" \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build Executable and Package
        run: |
          cd build
          make -j$(nproc)

      - name: List build tree
        run: find build -not -path "*/CMakeFiles/*" | sort

      - name: Collect artifact
        run: |
          mkdir -p output
          # RetroStudio_APPL (ALL target) produces .bin, .APPL, .dsk via MakePEF+Rez
          find build \( -name "*.bin" -o -name "*.dsk" -o -name "*.APPL" \) \
               -not -path "*/CMakeFiles/*" \
               -exec cp {} output/ \;
          echo "=== output/ ==="
          ls -lh output/

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RetroStudio-OS9
          path: output/*
